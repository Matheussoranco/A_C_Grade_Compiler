name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and run compiler tests
        run: make all runtime test
      - name: Confirm failing compilers cannot pass the smoke gate
        run: python3 tests/test_make_failure.py
      - name: Install the native assembler
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Execute generated programs at every optimization level
        run: python3 tests/test_native_execution.py
